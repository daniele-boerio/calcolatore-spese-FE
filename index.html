<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>SpassoConto</title>
    <meta name="apple-mobile-web-app-title" content="SpassoConto" />

    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Riallineato al primo paint dallo script qui sotto e, a runtime, da
         features/ui/theme.ts. -->
    <meta name="theme-color" content="#f6f8f7" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Prima del primo paint, così cambiare tema non produce un flash.
      // Duplica di proposito la logica di features/ui/theme.ts: non può
      // aspettare il bundle.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#0a1526" : "#f6f8f7");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();

      // Fix mobile viewport height (iOS Safari): set --app-height to window.innerHeight
      // and update on resize/orientation changes. Also set element heights directly
      // to avoid initial layout flashes that require the user to scroll.
      (function () {
        function applyHeights(h) {
          try {
            document.documentElement.style.setProperty('--app-height', h + 'px');
            // Also set explicit heights to avoid initial paint issues where CSS
            // using the variable is not yet applied.
            document.documentElement.style.height = h + 'px';
            document.body.style.height = h + 'px';
            var root = document.getElementById('root');
            if (root) root.style.height = h + 'px';
          } catch (e) {}
        }

        function setAppHeight() {
          var h = window.innerHeight || (window.visualViewport && window.visualViewport.height) || 0;
          applyHeights(h);
        }

        // Debug overlay creation / update
        function createDebugOverlay() {
          try {
            if (document.getElementById('debug-overlay')) return document.getElementById('debug-overlay');
            var ov = document.createElement('div');
            ov.id = 'debug-overlay';
            ov.className = 'debug-overlay';
            ov.innerHTML = '<div class="dbg-text">init…</div><button class="dbg-close">×</button>';
            document.body.appendChild(ov);
            ov.querySelector('.dbg-close').addEventListener('click', function (e) {
              ov.style.display = 'none';
              try { localStorage.setItem('debug_overlay', '0'); } catch (e) {}
            });
            return ov;
          } catch (e) { return null; }
        }

        function updateDebugOverlay(data) {
          try {
            var ov = createDebugOverlay();
            if (!ov) return;
            var txt = ov.querySelector('.dbg-text');
            if (!txt) return;
            var rows = [];
            rows.push('tabH: ' + (data.tabH ?? 'n/a'));
            rows.push('innerH: ' + (data.innerH ?? window.innerHeight));
            rows.push('visualH: ' + (data.visualH ?? (window.visualViewport && window.visualViewport.height)));
            rows.push('appH: ' + (data.appH ?? getComputedStyle(document.documentElement).getPropertyValue('--app-height')));
            rows.push('scrollable: ' + (data.scrollable ? 'yes' : 'no'));
            txt.innerText = rows.join('\n');
          } catch (e) {}
        }

        // Measure the actual tab bar after paint and apply its height to CSS
        // so padding-bottom matches the painted element (prevents initial gap).
        function measureTabbarAndApply() {
          try {
            var tab = document.querySelector('.tab-bar');
            if (!tab) return;
            var rect = tab.getBoundingClientRect();
            var tabH = Math.round(rect.height) || 0;
            // Set token override to measured value
            document.documentElement.style.setProperty('--tabbar-h', tabH + 'px');

            // Also set explicit padding on the content area to guarantee no gap
            var content = document.querySelector('.page__content');
            if (content) {
              // Match SCSS: calc(var(--tabbar-h) - 18px + env(safe-area-inset-bottom))
              content.style.paddingBottom = `calc(${tabH}px - 18px + env(safe-area-inset-bottom))`;
            }

            // For legacy slots (non .page) try to apply similar override
            var legacySlots = document.querySelectorAll('.App > *:not(.page):not(.tab-bar)');
            legacySlots.forEach(function (el) {
              el.style.paddingBottom = `calc(${tabH}px - 18px + env(safe-area-inset-bottom))`;
            });

            // Update debug overlay with measured values
            updateDebugOverlay({ tabH: tabH, innerH: window.innerHeight, visualH: window.visualViewport && window.visualViewport.height, appH: getComputedStyle(document.documentElement).getPropertyValue('--app-height'), scrollable: false });
          } catch (e) {}
        }

        // Run before paint if possible
        setAppHeight();
        // schedule a rAF to ensure layout is stable and tab-bar exists
        requestAnimationFrame(function () {
          setAppHeight();
          measureTabbarAndApply();
        });

        window.addEventListener('resize', function () {
          setAppHeight();
          requestAnimationFrame(function () {
            setAppHeight();
            measureTabbarAndApply();
          });
        });
        window.addEventListener('orientationchange', function () {
          setAppHeight();
          requestAnimationFrame(function () {
            setAppHeight();
            measureTabbarAndApply();
          });
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            setAppHeight();
            requestAnimationFrame(function () {
              setAppHeight();
              measureTabbarAndApply();
            });
          });
        }

        // Also ensure we measure again after DOMContentLoaded in case app mounts later
        document.addEventListener('DOMContentLoaded', function () {
          requestAnimationFrame(measureTabbarAndApply);
        });

        // If the SPA mounts after a delay (hot reload / dev), observe the root for the tab-bar
        var observer = new MutationObserver(function () {
          measureTabbarAndApply();
        });
        var rootNode = document.getElementById('root');
        if (rootNode) {
          observer.observe(rootNode, { childList: true, subtree: true });
        }

        // Prevent body-level scrolling on iOS/Android: allow touchmove only when the
        // touched element is inside a scrollable container (e.g. .page__content).
        function isScrollable(el) {
          while (el && el !== document.body) {
            try {
              var s = window.getComputedStyle(el);
              if ((s.overflowY === 'auto' || s.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) return true;
            } catch (e) {}
            el = el.parentElement;
          }
          return false;
        }

        document.addEventListener('touchstart', function (e) {
          // update overlay to show whether touchstart is in a scrollable element
          var sc = isScrollable(e.target);
          updateDebugOverlay({ tabH: getComputedStyle(document.documentElement).getPropertyValue('--tabbar-h'), innerH: window.innerHeight, visualH: window.visualViewport && window.visualViewport.height, appH: getComputedStyle(document.documentElement).getPropertyValue('--app-height'), scrollable: sc });
        }, { passive: true });

        document.addEventListener('touchmove', function (e) {
          var sc = isScrollable(e.target);
          updateDebugOverlay({ tabH: getComputedStyle(document.documentElement).getPropertyValue('--tabbar-h'), innerH: window.innerHeight, visualH: window.visualViewport && window.visualViewport.height, appH: getComputedStyle(document.documentElement).getPropertyValue('--app-height'), scrollable: sc });
          if (!sc) {
            e.preventDefault();
          }
        }, { passive: false });

        // Optionally create overlay on startup (user asked to show it)
        try {
          var showDebug = true;
          if (showDebug) createDebugOverlay();
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
