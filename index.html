<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>SpassoConto</title>
    <meta name="apple-mobile-web-app-title" content="SpassoConto" />

    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Riallineato al primo paint dallo script qui sotto e, a runtime, da
         features/ui/theme.ts. -->
    <meta name="theme-color" content="#f6f8f7" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Prima del primo paint, così cambiare tema non produce un flash.
      // Duplica di proposito la logica di features/ui/theme.ts: non può
      // aspettare il bundle.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#0a1526" : "#f6f8f7");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();

      // Altezza della finestra: su iOS 100dvh cambia con le barre di sistema,
      // quindi il valore buono lo misura questo script e lo lascia in
      // --app-height. Il CSS ci si appoggia (html, body, #root) e ha il suo
      // 100dvh di riserva.
      (function () {
        function setAppHeight() {
          try {
            var h =
              window.innerHeight ||
              (window.visualViewport && window.visualViewport.height) ||
              0;

            // Zero capita quando la webapp torna dallo sfondo prima che il
            // viewport si sia assestato. Scriverlo vorrebbe dire un'app alta
            // zero — schermata vuota — finché non arriva un resize: meglio
            // tenersi la misura buona di prima, o il 100dvh del CSS.
            if (!(h > 0)) return;

            document.documentElement.style.setProperty(
              "--app-height",
              h + "px",
            );
          } catch (e) {}
        }

        // La tab bar dipinta è più bassa del valore dichiarato nei token:
        // qui si misura quella vera e si aggiorna --tabbar-h. Lo spazio in
        // fondo lo calcola il CSS da quella variabile — scriverlo anche qui
        // voleva dire tenere due formule allineate a mano, e una delle due
        // era rimasta indietro.
        function measureTabbarAndApply() {
          try {
            var tab = document.querySelector(".tab-bar");
            if (!tab) return;

            var tabH = Math.round(tab.getBoundingClientRect().height) || 0;
            document.documentElement.style.setProperty(
              "--tabbar-h",
              tabH + "px",
            );
          } catch (e) {}
        }

        // Run before paint if possible
        setAppHeight();
        // schedule a rAF to ensure layout is stable and tab-bar exists
        requestAnimationFrame(function () {
          setAppHeight();
          measureTabbarAndApply();
        });

        window.addEventListener("resize", function () {
          setAppHeight();
          requestAnimationFrame(function () {
            setAppHeight();
            measureTabbarAndApply();
          });
        });
        window.addEventListener("orientationchange", function () {
          setAppHeight();
          requestAnimationFrame(function () {
            setAppHeight();
            measureTabbarAndApply();
          });
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            setAppHeight();
            requestAnimationFrame(function () {
              setAppHeight();
              measureTabbarAndApply();
            });
          });
        }

        // Riapertura della webapp: bfcache, ripresa dallo sfondo, cambio di
        // scheda. È il caso in cui la misura fatta all'avvio non vale più.
        window.addEventListener("pageshow", function () {
          setAppHeight();
          requestAnimationFrame(function () {
            setAppHeight();
            measureTabbarAndApply();
          });
        });

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) return;

          setAppHeight();
          requestAnimationFrame(function () {
            setAppHeight();
            measureTabbarAndApply();
          });
        });

        // Also ensure we measure again after DOMContentLoaded in case app mounts later
        document.addEventListener("DOMContentLoaded", function () {
          requestAnimationFrame(measureTabbarAndApply);
        });

        // If the SPA mounts after a delay (hot reload / dev), observe the root for the tab-bar
        var observer = new MutationObserver(measureTabbarAndApply);
        var rootNode = document.getElementById("root");
        if (rootNode) {
          observer.observe(rootNode, { childList: true, subtree: true });
        }

        // Prevent body-level scrolling on iOS/Android: allow touchmove only when the
        // touched element is inside a scrollable container (e.g. .page__content).
        function isScrollable(el) {
          while (el && el !== document.body) {
            try {
              var s = window.getComputedStyle(el);
              if (
                (s.overflowY === "auto" || s.overflowY === "scroll") &&
                el.scrollHeight > el.clientHeight
              )
                return true;
            } catch (e) {}
            el = el.parentElement;
          }
          return false;
        }

        document.addEventListener(
          "touchmove",
          function (e) {
            if (!isScrollable(e.target)) {
              e.preventDefault();
            }
          },
          { passive: false },
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
